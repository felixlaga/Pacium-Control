name: Linux validation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-24-x64:
    name: Ubuntu 24.04 x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      npm_config_build_from_source: "true"

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install supported Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Record platform versions
        run: |
          node --version
          pnpm --version
          uname -m
          . /etc/os-release
          printf '%s\n' "$PRETTY_NAME"

      - name: Install frozen source-native dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      - name: Run bounded lifecycle soak
        run: pnpm test:soak

      - name: Build and verify Linux package
        run: pnpm package:linux:verify

      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium workflows
        run: pnpm test:e2e

      - name: Upload verified development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pacium-control-linux-x64-${{ github.run_id }}
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.sha256
          if-no-files-found: error
          retention-days: 7
